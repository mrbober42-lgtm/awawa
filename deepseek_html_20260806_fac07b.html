<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Caelestia UI · Material Design 3 (refined)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-primary: #D0BCFF;
      --md-sys-color-on-primary: #381E72;
      --md-sys-color-primary-container: #4F378B;
      --md-sys-color-on-primary-container: #EADDFF;
      --md-sys-color-secondary: #CCC2DC;
      --md-sys-color-on-secondary: #332D41;
      --md-sys-color-secondary-container: #4A4458;
      --md-sys-color-on-secondary-container: #E8DEF8;
      --md-sys-color-tertiary: #EFB8C8;
      --md-sys-color-on-tertiary: #492532;
      --md-sys-color-tertiary-container: #633B48;
      --md-sys-color-on-tertiary-container: #FFD8E4;
      --md-sys-color-error: #F2B8B5;
      --md-sys-color-on-error: #601410;
      --md-sys-color-error-container: #8C1D18;
      --md-sys-color-on-error-container: #F9DEDC;
      --md-sys-color-background: #1C1B1F;
      --md-sys-color-on-background: #E6E1E5;
      --md-sys-color-surface: #1C1B1F;
      --md-sys-color-on-surface: #E6E1E5;
      --md-sys-color-surface-variant: #49454F;
      --md-sys-color-on-surface-variant: #CAC4D0;
      --md-sys-color-outline: #938F99;
      --md-sys-color-outline-variant: #49454F;
      --md-sys-elevation-1: 0px 1px 2px rgba(0,0,0,0.3), 0px 1px 3px rgba(0,0,0,0.15);
      --md-sys-elevation-2: 0px 1px 2px rgba(0,0,0,0.3), 0px 2px 6px rgba(0,0,0,0.15);
      --md-sys-elevation-3: 0px 4px 8px rgba(0,0,0,0.15), 0px 1px 3px rgba(0,0,0,0.3);
      --md-sys-elevation-4: 0px 6px 10px rgba(0,0,0,0.15), 0px 2px 3px rgba(0,0,0,0.3);
      --font-family: 'Roboto Flex', system-ui, sans-serif;
      --left-pad: 80px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--md-sys-color-background);
      font-family: var(--font-family);
      color: var(--md-sys-color-on-background);
      overflow: hidden;
      height: 100vh; width: 100vw;
      user-select: none; -webkit-user-select: none;
    }

    #desktop {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 50%, #2B2930 0%, #1C1B1F 100%);
    }

    #leftDock {
      position: fixed;
      left: 0; top: 0;
      width: var(--left-pad); height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: transparent; z-index: 20; pointer-events: auto;
    }
    .dock-icon {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 6px; border-radius: 14px; cursor: pointer;
      transition: background 0.2s; width: 70px;
      position: relative;
    }
    .dock-icon.circle { border-radius: 50%; width: 56px; height: 56px; justify-content: center; padding: 0; }
    .dock-icon:hover { background: rgba(255,255,255,0.1); }
    .dock-icon .material-symbols-outlined { font-size: 30px; color: var(--md-sys-color-primary); }
    .dock-icon span { font-size: 10px; color: var(--md-sys-color-on-surface-variant); text-align: center; }

    .app-window {
      position: absolute; background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 16px;
      box-shadow: var(--md-sys-elevation-3); min-width: 320px; min-height: 200px;
      display: flex; flex-direction: column; overflow: hidden;
      resize: both; backdrop-filter: blur(8px);
    }
    .window-titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: var(--md-sys-color-surface-variant); cursor: move;
    }
    .window-title { font-size: 14px; font-weight: 500; }
    .window-content { flex: 1; padding: 16px; color: var(--md-sys-color-on-surface); }

    #panelContentContainer {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
    }
    .edge-panel {
      position: absolute;
      background: transparent;
      overflow: hidden;
      display: none;
      flex-direction: column;
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .edge-panel.active {
      display: flex;
      opacity: 1;
    }

    svg.canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
    }
    svg.canvas .frame-stroke {
      fill: none; stroke: var(--md-sys-color-primary);
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
      opacity: 0.8;
    }

    .md3-switch { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
    .md3-switch input[type="checkbox"] {
      appearance: none; width: 52px; height: 32px;
      background: var(--md-sys-color-surface-variant); border-radius: 100px;
      position: relative; outline: none; cursor: pointer;
      border: 2px solid var(--md-sys-color-outline); transition: 0.3s;
    }
    .md3-switch input[type="checkbox"]::before {
      content: ""; position: absolute; width: 24px; height: 24px;
      border-radius: 50%; background: var(--md-sys-color-outline);
      top: 2px; left: 2px; transition: 0.3s;
    }
    .md3-switch input[type="checkbox"]:checked {
      background: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary);
    }
    .md3-switch input[type="checkbox"]:checked::before { left: 22px; background: var(--md-sys-color-on-primary); }
    .md3-slider { width: 100%; accent-color: var(--md-sys-color-primary); }
    .md3-button {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border: none; border-radius: 20px; padding: 10px 20px;
      font-weight: 500; cursor: pointer; transition: 0.2s;
    }
    .md3-button:hover { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
    .md3-card {
      background: var(--md-sys-color-surface-variant);
      border-radius: 12px; padding: 12px; margin: 4px 0;
    }
  </style>
</head>
<body>
  <div id="desktop">
    <div id="windowsContainer" style="position:relative; width:100%; height:100%; pointer-events:none;"></div>
  </div>

  <div id="panelContentContainer"></div>

  <svg class="canvas" id="canvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="inverseFillMask">
        <rect width="100%" height="100%" fill="white" />
        <path id="processedPathMask" fill="black" />
      </mask>
    </defs>
    <rect id="outerFill" fill="var(--md-sys-color-primary-container)" opacity="0.35" mask="url(#inverseFillMask)" width="100%" height="100%" pointer-events="none" />
    <path id="frameStrokePath" class="frame-stroke" d="" />
  </svg>

  <div id="leftDock"></div>

  <script>
    (() => {
      const Caelestia = {
        panels: [],
        cornerRadius: 24,
        mergeThreshold: 20,
        padding: { top: 16, right: 16, bottom: 16, left: 80 },
        activeEdgePanels: new Set(),
        edgeThreshold: 15,
        animationFrame: null,
        contentContainer: document.getElementById('panelContentContainer'),
        leftDock: document.getElementById('leftDock'),
        canvas: document.getElementById('canvas'),
        frameStrokePath: document.getElementById('frameStrokePath'),
        processedPathMask: document.getElementById('processedPathMask'),

        _dist(p1,p2) { return Math.sqrt((p1.x-p2.x)**2+(p1.y-p2.y)**2); },
        _dot(p1,p2) { return p1.x*p2.x+p1.y*p2.y; },
        _cross2D(a,b) { return a.x*b.y-a.y*b.x; },
        _normalize(v) { const l=Math.sqrt(v.x*v.x+v.y*v.y); return l<1e-9?{x:0,y:0}:{x:v.x/l,y:v.y/l}; },
        _sub(a,b) { return {x:a.x-b.x,y:a.y-b.y}; },
        _add(a,b) { return {x:a.x+b.x,y:a.y+b.y}; },
        _scale(v,s) { return {x:v.x*s,y:v.y*s}; },
        _clamp(v,min,max) { return Math.max(min,Math.min(max,v)); },

        createPanel(config) {
          const defaults = {
            id: 'panel_' + Date.now(),
            side: 'right',
            position: 0.5,
            size: 0.2,
            maxDepth: 200,
            title: '',
            content: '',
            icon: null,
            trigger: 'edge', // 'edge' или 'icon'
            shape: 'rounded', // 'rounded' или 'circle' (только для иконки)
            animatedOpen: true
          };
          const panel = Object.assign({}, defaults, config);
          panel.depth = 0;
          panel.target = 0;
          panel.animStart = null;
          panel.animFrom = 0;
          panel.isHovered = false;
          panel.contentDiv = null;
          panel.closeTimer = null;
          panel._iconElement = null;

          const div = document.createElement('div');
          div.className = 'edge-panel';
          div.innerHTML = panel.content;
          div.addEventListener('mouseenter', () => {
            panel.isHovered = true;
            if (panel.closeTimer) { clearTimeout(panel.closeTimer); panel.closeTimer = null; }
            if (panel.trigger === 'icon' && panel.target === 0) {
              Caelestia._startOpen(panel);
            }
          });
          div.addEventListener('mouseleave', () => {
            panel.isHovered = false;
            if (panel.trigger === 'icon') Caelestia._scheduleClose(panel);
          });
          this.contentContainer.appendChild(div);
          panel.contentDiv = div;
          this.panels.push(panel);

          if (panel.icon) {
            const iconDiv = document.createElement('div');
            iconDiv.className = 'dock-icon' + (panel.shape === 'circle' ? ' circle' : '');
            iconDiv.innerHTML = `<span class="material-symbols-outlined">${panel.icon}</span>`;
            if (panel.shape !== 'circle') {
              iconDiv.innerHTML += `<span>${panel.title || panel.id}</span>`;
            }
            if (panel.trigger === 'icon') {
              iconDiv.addEventListener('mouseenter', () => {
                if (panel.target === 0) Caelestia._startOpen(panel);
              });
              iconDiv.addEventListener('mouseleave', () => {
                Caelestia._scheduleClose(panel);
              });
            } else {
              iconDiv.addEventListener('click', () => Caelestia.togglePanel(panel.id));
            }
            this.leftDock.appendChild(iconDiv);
            panel._iconElement = iconDiv;
          }
          this.update();
          return panel;
        },

        openPanel(id) {
          const panel = this.panels.find(p => p.id === id);
          if (!panel || panel.target === panel.maxDepth) return;
          this._startOpen(panel);
        },

        closePanel(id, immediate = false) {
          const panel = this.panels.find(p => p.id === id);
          if (!panel || panel.target === 0) return;
          if (immediate) {
            panel.depth = 0;
            panel.target = 0;
            panel.animStart = null;
            this.update();
          } else {
            panel.animFrom = panel.depth;
            panel.animStart = performance.now();
            panel.target = 0;
            if (!this.animationFrame) this._startAnimation();
          }
          if (panel.closeTimer) { clearTimeout(panel.closeTimer); panel.closeTimer = null; }
        },

        togglePanel(id) {
          const panel = this.panels.find(p => p.id === id);
          if (!panel) return;
          if (panel.target === panel.maxDepth) this.closePanel(id);
          else this.openPanel(id);
        },

        _startOpen(panel) {
          panel.animFrom = panel.depth;
          panel.animStart = performance.now();
          panel.target = panel.maxDepth;
          if (!this.animationFrame) this._startAnimation();
        },

        _scheduleClose(panel) {
          if (panel.closeTimer) clearTimeout(panel.closeTimer);
          panel.closeTimer = setTimeout(() => {
            if (!panel.isHovered && (panel.trigger !== 'edge' || !Caelestia._isEdgeActive(panel.side))) {
              Caelestia.closePanel(panel.id);
            }
            panel.closeTimer = null;
          }, 250);
        },

        _isEdgeActive(side) {
          return this._edgeState[side] || false;
        },

        _buildRawPathPoints() {
          const w = window.innerWidth, h = window.innerHeight;
          const { top, right, bottom, left } = this.padding;
          const x0 = left, y0 = top, x1 = w - right, y1 = h - bottom;
          const bySide = { top:[], bottom:[], left:[], right:[] };
          this.panels.forEach(p => { if (p.depth > 0.5) bySide[p.side].push(p); });
          for (const s of Object.keys(bySide)) bySide[s].sort((a,b) => a.position - b.position);
          const points = [];
          const addLine = (ax,ay,bx,by) => points.push({x:ax,y:ay},{x:bx,y:by});
          const addCutout = (sx,sy,ex,ey,depth,n) => {
            if (depth < 0.5) { points.push({x:sx,y:sy},{x:ex,y:ey}); return; }
            points.push({x:sx,y:sy}, {x:sx+n.x*depth, y:sy+n.y*depth}, {x:ex+n.x*depth, y:ey+n.y*depth}, {x:ex,y:ey});
          };
          const edges = [
            {sx:x0,sy:y0,ex:x1,ey:y0,side:'top',n:{x:0,y:1}},
            {sx:x1,sy:y0,ex:x1,ey:y1,side:'right',n:{x:-1,y:0}},
            {sx:x1,sy:y1,ex:x0,ey:y1,side:'bottom',n:{x:0,y:-1}},
            {sx:x0,sy:y1,ex:x0,ey:y0,side:'left',n:{x:1,y:0}}
          ];
          for (const e of edges) {
            const list = bySide[e.side];
            const len = this._dist({x:e.sx,y:e.sy},{x:e.ex,y:e.ey});
            if (!list.length) { addLine(e.sx,e.sy,e.ex,e.ey); continue; }
            const dir = this._normalize({x:e.ex-e.sx,y:e.ey-e.sy});
            let cur = 0;
            for (const p of list) {
              const ps = p.position - p.size/2, pe = p.position + p.size/2;
              if (ps > cur+0.0001) addLine(e.sx+dir.x*cur*len, e.sy+dir.y*cur*len, e.sx+dir.x*ps*len, e.sy+dir.y*ps*len);
              addCutout(e.sx+dir.x*ps*len, e.sy+dir.y*ps*len, e.sx+dir.x*pe*len, e.sy+dir.y*pe*len, p.depth, e.n);
              cur = pe;
            }
            if (cur < 1-0.0001) addLine(e.sx+dir.x*cur*len, e.sy+dir.y*cur*len, e.ex, e.ey);
          }
          const res = [];
          for (const pt of points) {
            if (!res.length || Math.abs(res[res.length-1].x-pt.x)>0.01 || Math.abs(res[res.length-1].y-pt.y)>0.01) res.push(pt);
          }
          if (res.length>1 && Math.abs(res[0].x-res[res.length-1].x)<0.01 && Math.abs(res[0].y-res[res.length-1].y)<0.01) res.pop();
          return res;
        },

        _mergeCloseLines(points, threshold) {
          if (points.length < 4 || threshold <= 0) return { points: [...points], mergeEvents: [] };
          // Объединение близких параллельных противоположных отрезков
          const n = points.length;
          const segs = [];
          for (let i = 0; i < n; i++) {
            const j = (i + 1) % n;
            const p1 = points[i], p2 = points[j];
            const len = this._dist(p1, p2);
            if (len > 0.01) segs.push({ i, j, p1, p2, dir: this._normalize({ x: p2.x - p1.x, y: p2.y - p1.y }), len });
          }
          const pairs = [];
          for (let a = 0; a < segs.length; a++) {
            for (let b = a + 1; b < segs.length; b++) {
              const sa = segs[a], sb = segs[b];
              if (sa.j === sb.i || sb.j === sa.i) continue;
              if (Math.abs(this._dot(sa.dir, sb.dir)) < 0.95) continue;
              if (this._dot(sa.dir, sb.dir) > 0) continue; // только противоположно направленные
              const midA = { x: (sa.p1.x + sa.p2.x) / 2, y: (sa.p1.y + sa.p2.y) / 2 };
              const midB = { x: (sb.p1.x + sb.p2.x) / 2, y: (sb.p1.y + sb.p2.y) / 2 };
              const perpDir = { x: -sa.dir.y, y: sa.dir.x };
              const perpDist = Math.abs(this._dot(this._sub(midB, midA), perpDir));
              if (perpDist < threshold) pairs.push({ a: sa, b: sb, dist: perpDist });
            }
          }
          if (!pairs.length) return { points: [...points], mergeEvents: [] };
          pairs.sort((x, y) => x.dist - y.dist);
          const used = new Set(), reps = [], events = [];
          for (const p of pairs) {
            if (used.has(p.a.i) || used.has(p.b.i)) continue;
            used.add(p.a.i); used.add(p.b.i);
            const start = p.a.p1, end = p.b.p2;
            const mid = { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 };
            reps.push({ startIdx: p.a.i, endIdx: p.b.j, bridge: [start, mid, end] });
            events.push({ pos: mid, dist: p.dist });
          }
          const map = {};
          reps.forEach(r => map[r.startIdx] = r);
          const newPts = [], proc = new Set();
          let i = 0, it = 0;
          while (it < n * 3 && newPts.length < n + reps.length * 3) {
            it++;
            if (proc.has(i)) break;
            if (map[i]) {
              const r = map[i];
              r.bridge.forEach(bp => newPts.push({ x: bp.x, y: bp.y }));
              let idx = r.startIdx;
              while (idx !== r.endIdx) { proc.add(idx); idx = (idx + 1) % n; }
              proc.add(r.endIdx);
              i = (r.endIdx + 1) % n;
            } else {
              if (!proc.has(i)) { newPts.push({ x: points[i].x, y: points[i].y }); proc.add(i); }
              i = (i + 1) % n;
            }
            if (proc.size >= n) break;
            if (i === 0 && newPts.length > 2) break;
          }
          if (newPts.length < 3) return { points: [...points], mergeEvents: [] };
          const first = newPts[0], last = newPts[newPts.length - 1];
          if (Math.abs(first.x - last.x) > 0.5 || Math.abs(first.y - last.y) > 0.5) newPts.push({ x: first.x, y: first.y });
          return { points: newPts, mergeEvents: events };
        },

        _mergeRightAngles(points, threshold) {
          if (points.length < 4 || threshold <= 0) return [...points];
          const n = points.length;
          const result = [];
          const merged = new Array(n).fill(false);
          for (let i = 0; i < n; i++) {
            if (merged[i]) continue;
            const curr = points[i];
            const next = points[(i + 1) % n];
            const prev = points[(i - 1 + n) % n];
            // ищем угол ~90°
            const v1 = this._normalize(this._sub(prev, curr));
            const v2 = this._normalize(this._sub(next, curr));
            const dot = this._dot(v1, v2);
            const angle = Math.acos(this._clamp(dot, -1, 1));
            if (Math.abs(angle - Math.PI / 2) > 0.1 && Math.abs(angle - 3 * Math.PI / 2) > 0.1) {
              result.push(curr);
              continue;
            }
            // поищем соседние точки на расстоянии < threshold, которые тоже образуют угол 90°
            let found = false;
            for (let j = i + 1; j < n; j++) {
              if (merged[j]) continue;
              const other = points[j];
              const d = this._dist(curr, other);
              if (d < threshold) {
                const otherPrev = points[(j - 1 + n) % n];
                const otherNext = points[(j + 1) % n];
                const w1 = this._normalize(this._sub(otherPrev, other));
                const w2 = this._normalize(this._sub(otherNext, other));
                const dotO = this._dot(w1, w2);
                const angleO = Math.acos(this._clamp(dotO, -1, 1));
                if (Math.abs(angleO - Math.PI / 2) < 0.1 || Math.abs(angleO - 3 * Math.PI / 2) < 0.1) {
                  // объединяем: заменяем две точки одной средней
                  const mid = { x: (curr.x + other.x) / 2, y: (curr.y + other.y) / 2 };
                  result.push(mid);
                  merged[i] = merged[j] = true;
                  found = true;
                  break;
                }
              }
            }
            if (!found) result.push(curr);
          }
          if (result.length < 3) return [...points];
          // замкнем, если нужно
          const first = result[0], last = result[result.length - 1];
          if (this._dist(first, last) > 0.5) result.push({ x: first.x, y: first.y });
          return result;
        },

        _roundCorners(points, radius) {
          if (points.length < 3 || radius <= 0.5) return [...points];
          const n = points.length, res = [];
          for (let i = 0; i < n; i++) {
            const prev = points[(i - 1 + n) % n], curr = points[i], next = points[(i + 1) % n];
            const vIn = this._normalize(this._sub(prev, curr)), vOut = this._normalize(this._sub(next, curr));
            const inLen = this._dist(prev, curr), outLen = this._dist(curr, next);
            if (inLen < 0.5 || outLen < 0.5) { res.push({ x: curr.x, y: curr.y }); continue; }
            const dotProd = this._clamp(this._dot(vIn, vOut), -1, 1), angle = Math.acos(dotProd);
            if (angle < 0.02 || Math.abs(angle - Math.PI) < 0.02) { res.push({ x: curr.x, y: curr.y }); continue; }
            const tanHalf = Math.tan(angle / 2);
            let d = radius / tanHalf;
            d = Math.min(d, inLen * 0.48, outLen * 0.48);
            if (d < 0.3) { res.push({ x: curr.x, y: curr.y }); continue; }
            const actual = d * tanHalf;
            const pStart = this._add(curr, this._scale(vIn, d)), pEnd = this._add(curr, this._scale(vOut, d));
            const sweep = this._cross2D(vIn, vOut) > 0 ? 0 : 1;
            res.push({ x: pStart.x, y: pStart.y });
            res.push({ x: pEnd.x, y: pEnd.y, isArc: true, rx: actual, ry: actual, sweepFlag: sweep });
          }
          return res;
        },

        _pointsToSVGPath(points, close = true) {
          if (!points.length) return '';
          let d = '', first = null, isFirst = true;
          for (const pt of points) {
            if (pt.isArc) {
              d += ` A ${pt.rx.toFixed(3)} ${pt.ry.toFixed(3)} 0 0 ${pt.sweepFlag} ${pt.x.toFixed(3)} ${pt.y.toFixed(3)}`;
              continue;
            }
            if (isFirst) { d += `M ${pt.x.toFixed(3)} ${pt.y.toFixed(3)}`; first = pt; isFirst = false; }
            else d += ` L ${pt.x.toFixed(3)} ${pt.y.toFixed(3)}`;
          }
          if (close && points.length > 2 && first) {
            const last = points[points.length - 1];
            if (!last.isArc || Math.abs(last.x - first.x) > 0.01 || Math.abs(last.y - first.y) > 0.01) d += ' Z';
          }
          return d;
        },

        _updatePanelContent(panel) {
          const div = panel.contentDiv;
          if (!div) return;
          const w = window.innerWidth, h = window.innerHeight;
          const { top, right, bottom, left } = this.padding;
          const x0 = left, y0 = top, x1 = w - right, y1 = h - bottom;
          const depth = panel.depth;
          if (depth < 3) {
            div.classList.remove('active');
            return;
          }
          const edgeLen = (panel.side === 'top' || panel.side === 'bottom') ? x1 - x0 : y1 - y0;
          const panelLen = edgeLen * panel.size;
          const center = panel.position * edgeLen;
          let leftPos, topPos, width, height;
          if (panel.side === 'top') {
            leftPos = x0 + center - panelLen / 2; topPos = y0; width = panelLen; height = depth;
          } else if (panel.side === 'bottom') {
            leftPos = x0 + center - panelLen / 2; topPos = y1 - depth; width = panelLen; height = depth;
          } else if (panel.side === 'left') {
            leftPos = x0; topPos = y0 + center - panelLen / 2; width = depth; height = panelLen;
          } else if (panel.side === 'right') {
            leftPos = x1 - depth; topPos = y0 + center - panelLen / 2; width = depth; height = panelLen;
          }
          div.style.left = leftPos + 'px';
          div.style.top = topPos + 'px';
          div.style.width = width + 'px';
          div.style.height = height + 'px';
          div.classList.add('active');
        },

        update() {
          const raw = this._buildRawPathPoints();
          // Шаг 1: объединение прямых углов
          let points = this._mergeRightAngles(raw, this.mergeThreshold);
          // Шаг 2: объединение параллельных линий
          const merged = this._mergeCloseLines(points, this.mergeThreshold);
          points = merged.points;
          if (points.length < 4) points = raw;
          // Шаг 3: скругление
          const rounded = this._roundCorners(points, this.cornerRadius);
          const pathStr = this._pointsToSVGPath(rounded, true);
          this.frameStrokePath.setAttribute('d', pathStr);
          this.processedPathMask.setAttribute('d', pathStr);
          this.panels.forEach(p => this._updatePanelContent(p));
        },

        _animStep(now) {
          let changed = false;
          for (const p of Caelestia.panels) {
            if (p.target !== p.depth) {
              if (p.animStart === null) { p.animStart = now; p.animFrom = p.depth; }
              const t = Math.min((now - p.animStart) / 400, 1.0);
              const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
              p.depth = p.animFrom + (p.target - p.animFrom) * eased;
              if (t >= 1.0) {
                p.depth = p.target;
                p.animStart = null;
              }
              changed = true;
            } else {
              p.animStart = null;
            }
          }
          if (changed) Caelestia.update();
          Caelestia.animationFrame = requestAnimationFrame(Caelestia._animStep);
        },

        _startAnimation() {
          if (this.animationFrame) return;
          this.animationFrame = requestAnimationFrame(this._animStep);
        },

        _edgeState: { top: false, bottom: false, right: false, left: false },

        _initEdgeDetection() {
          document.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const nearRight = window.innerWidth - clientX < this.edgeThreshold && clientX > this.padding.left;
            const nearTop = clientY < this.edgeThreshold;
            const nearBottom = window.innerHeight - clientY < this.edgeThreshold;
            this._edgeState.right = nearRight;
            this._edgeState.top = nearTop;
            this._edgeState.bottom = nearBottom;

            if (nearRight) this._openEdgePanels('right', clientX, clientY);
            else this._closeEdgePanels('right');

            if (nearTop) this._openEdgePanels('top', clientX, clientY);
            else this._closeEdgePanels('top');

            if (nearBottom) this._openEdgePanels('bottom', clientX, clientY);
            else this._closeEdgePanels('bottom');
          });
          document.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            if (window.innerWidth - t.clientX < this.edgeThreshold) this._openEdgePanels('right', t.clientX, t.clientY);
            if (t.clientY < this.edgeThreshold) this._openEdgePanels('top', t.clientX, t.clientY);
            if (window.innerHeight - t.clientY < this.edgeThreshold) this._openEdgePanels('bottom', t.clientX, t.clientY);
          });
          document.addEventListener('touchend', () => {
            this._closeEdgePanels('right');
            this._closeEdgePanels('top');
            this._closeEdgePanels('bottom');
          });
        },

        _openEdgePanels(side, clientX, clientY) {
          const candidates = this.panels.filter(p => p.side === side && p.trigger === 'edge');
          if (candidates.length === 0) return;
          let targetPanel;
          if (side === 'right') {
            const relY = clientY / window.innerHeight;
            candidates.sort((a, b) => Math.abs(a.position - relY) - Math.abs(b.position - relY));
            targetPanel = candidates[0];
          } else {
            targetPanel = candidates[0];
          }
          if (targetPanel && targetPanel.target === 0) {
            this._startOpen(targetPanel);
            this.activeEdgePanels.add(targetPanel.id);
          }
        },

        _closeEdgePanels(side) {
          this.panels.filter(p => p.side === side && p.trigger === 'edge' && this.activeEdgePanels.has(p.id)).forEach(p => {
            if (!p.isHovered) {
              this.closePanel(p.id);
              this.activeEdgePanels.delete(p.id);
            }
          });
        }
      };

      // ── Создание панелей ──
      // Edge панели (открываются по краю)
      Caelestia.createPanel({
        id: 'launcher', side: 'top', position: 0.5, size: 0.45, maxDepth: 180,
        title: 'Лаунчер', icon: 'apps', trigger: 'edge',
        content: `
          <div style="padding:16px; color:var(--md-sys-color-on-surface);">
            <div style="display:flex; background:var(--md-sys-color-surface-variant); border-radius:28px; padding:4px 16px; align-items:center; margin-bottom:12px;">
              <span class="material-symbols-outlined">search</span>
              <input placeholder="Поиск..." style="background:transparent;border:none;outline:none;flex:1;padding:12px;color:inherit;">
            </div>
            <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
              ${['folder','public','settings','photo_camera','music_note','videocam','description','map'].map(icon => `
                <div style="display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:16px;cursor:pointer;" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='transparent'">
                  <span class="material-symbols-outlined" style="font-size:28px;">${icon}</span><small>${icon}</small>
                </div>`).join('')}
            </div>
          </div>`
      });

      Caelestia.createPanel({
        id: 'quick', side: 'right', position: 0.3, size: 0.2, maxDepth: 240,
        title: 'Быстрые настройки', icon: 'tune', trigger: 'edge',
        content: `
          <div style="padding:16px; display:flex; flex-direction:column; gap:8px; color:var(--md-sys-color-on-surface);">
            <div class="md3-switch"><span class="material-symbols-outlined">wifi</span> Wi-Fi <input type="checkbox" checked></div>
            <div class="md3-switch"><span class="material-symbols-outlined">bluetooth</span> Bluetooth <input type="checkbox"></div>
            <div class="md3-switch"><span class="material-symbols-outlined">dark_mode</span> Тёмная тема <input type="checkbox" checked></div>
          </div>`
      });

      Caelestia.createPanel({
        id: 'media', side: 'right', position: 0.7, size: 0.22, maxDepth: 220,
        title: 'Медиа', icon: 'headphones', trigger: 'edge',
        content: `
          <div style="padding:16px; color:var(--md-sys-color-on-surface); display:flex; flex-direction:column; gap:12px;">
            <div style="display:flex; gap:12px; align-items:center;">
              <div style="width:56px;height:56px;background:var(--md-sys-color-primary-container);border-radius:12px;display:flex;align-items:center;justify-content:center;"><span class="material-symbols-outlined" style="font-size:32px;">music_note</span></div>
              <div><strong>Caelestia Waves</strong><br><small>Stellar Drift</small></div>
            </div>
            <input type="range" class="md3-slider" value="70">
            <div style="display:flex; justify-content:center; gap:16px;">
              <span class="material-symbols-outlined" style="cursor:pointer;">skip_previous</span>
              <span class="material-symbols-outlined" style="font-size:40px; cursor:pointer;" onclick="this.textContent=this.textContent==='play_circle'?'pause_circle':'play_circle'">pause_circle</span>
              <span class="material-symbols-outlined" style="cursor:pointer;">skip_next</span>
            </div>
          </div>`
      });

      Caelestia.createPanel({
        id: 'dockPanel', side: 'bottom', position: 0.5, size: 0.6, maxDepth: 72,
        title: 'Док', icon: 'dock', trigger: 'edge',
        content: `
          <div style="display:flex; align-items:center; justify-content:center; gap:24px; height:100%; padding:0 16px; color:var(--md-sys-color-on-surface);">
            <span class="material-symbols-outlined" style="font-size:28px; cursor:pointer;">folder</span>
            <span class="material-symbols-outlined" style="font-size:28px; cursor:pointer;">public</span>
            <span class="material-symbols-outlined" style="font-size:28px; cursor:pointer;" onclick="openWindow('settings')">settings</span>
            <span class="material-symbols-outlined" style="font-size:28px; cursor:pointer;">apps</span>
            <div style="margin-left:auto; font-size:14px; font-weight:500;" id="dockClock"></div>
          </div>`
      });

      // Icon-панели (открываются только по наведению на иконку)
      Caelestia.createPanel({
        id: 'notifications', side: 'left', position: 0.4, size: 0.18, maxDepth: 220,
        title: 'Уведомления', icon: 'notifications', trigger: 'icon', shape: 'circle',
        content: `
          <div style="padding:16px; color:var(--md-sys-color-on-surface);">
            <h3 style="margin-bottom:12px; font-weight:500;">Уведомления</h3>
            <div class="md3-card"><strong>Обновление системы</strong><br><small>Версия 2.1 доступна</small></div>
            <div class="md3-card"><strong>Новое сообщение</strong><br><small>Астронавт: проверь модуль</small></div>
            <div class="md3-card"><strong>Сигнал</strong><br><small>Сектор 7G активен</small></div>
          </div>`
      });

      Caelestia.createPanel({
        id: 'wifiSettings', side: 'left', position: 0.55, size: 0.2, maxDepth: 250,
        title: 'Wi-Fi', icon: 'wifi', trigger: 'icon',
        content: `
          <div style="padding:16px; color:var(--md-sys-color-on-surface);">
            <div class="md3-switch"><span class="material-symbols-outlined">wifi</span> Wi-Fi <input type="checkbox" checked></div>
            <small>Сеть: Caelestia-5G</small>
          </div>`
      });

      window.openWindow = function(type) {
        const container = document.getElementById('windowsContainer');
        if (document.querySelector(`.app-window[data-type="${type}"]`)) return;
        const win = document.createElement('div');
        win.className = 'app-window';
        win.setAttribute('data-type', type);
        win.style.left = '120px'; win.style.top = '100px'; win.style.zIndex = Date.now();
        win.innerHTML = `<div class="window-titlebar"><span class="window-title">${type}</span><span class="material-symbols-outlined" style="cursor:pointer;" onclick="this.closest('.app-window').remove()">close</span></div><div class="window-content">Содержимое ${type}</div>`;
        container.appendChild(win);
        makeDraggable(win);
      };

      function makeDraggable(win) {
        const titlebar = win.querySelector('.window-titlebar');
        let offsetX, offsetY, dragging = false;
        titlebar.addEventListener('mousedown', (e) => {
          dragging = true;
          offsetX = e.clientX - win.offsetLeft;
          offsetY = e.clientY - win.offsetTop;
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
        function onMouseMove(e) { if (!dragging) return; win.style.left = (e.clientX - offsetX) + 'px'; win.style.top = (e.clientY - offsetY) + 'px'; }
        function onMouseUp() { dragging = false; document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); }
      }

      window.updateFrameRadius = function(v) {
        Caelestia.cornerRadius = parseInt(v);
        document.getElementById('radiusSliderUI').value = Caelestia.cornerRadius;
        Caelestia.update();
      };
      window.updateFrameMerge = function(v) {
        Caelestia.mergeThreshold = parseInt(v);
        document.getElementById('mergeSliderUI').value = Caelestia.mergeThreshold;
        Caelestia.update();
      };

      Caelestia._initEdgeDetection();
      Caelestia.update();
      Caelestia._startAnimation();

      setInterval(() => {
        const clock = document.getElementById('dockClock');
        if (clock) clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }, 1000);

      window.addEventListener('resize', () => {
        clearTimeout(window.resized);
        window.resized = setTimeout(() => {
          Caelestia.panels.forEach(p => { p.depth = 0; p.target = 0; p.animStart = null; });
          Caelestia.update();
        }, 150);
      });
    })();
  </script>
</body>
</html>

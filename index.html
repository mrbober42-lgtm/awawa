<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Baklava</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark-theme">
  <!-- SVG рамка с инвертированной заливкой -->
  <svg class="frame-canvas" id="frameCanvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="inverseFillMask">
        <rect width="100%" height="100%" fill="white" />
        <path id="framePathMask" fill="black" />
      </mask>
    </defs>
    <!-- Инвертированная заливка: чёрная в тёмной теме, белая в светлой -->
    <rect id="frameOuterFill" class="frame-inverted-fill" fill="#000000" mask="url(#inverseFillMask)" width="100%" height="100%" pointer-events="none" />
    <path id="frameStrokePath" class="frame-stroke" d="" />
  </svg>

  <!-- Рабочий стол -->
  <div id="desktop">
    <div id="desktop-icons-layer"></div>
    <div id="widgets-layer"></div>
  </div>

  <!-- Слой для окон -->
  <div id="windows-layer"></div>

  <!-- Контейнер для содержимого панелей -->
  <div id="panelContentContainer"></div>

  <!-- Левая панель (Bar) - элементы будут добавлены через JS -->
  <div id="leftBar"></div>

  <!-- Модальные окна -->
  <div id="modal-overlay"></div>

  <!-- Пикер виджетов -->
  <div id="widget-picker" class="widget-picker hidden">
    <div class="widget-picker-header">
      <span>Виджеты</span>
      <button class="md3-icon-btn" id="closeWidgetPicker"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="widget-picker-content" id="widgetPickerContent"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
